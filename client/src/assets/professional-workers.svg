<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
<title id="title">Professional home service tools</title>
<desc id="desc">A polished still life of a toolbox, maintenance tools, cleaning supplies, folded towels, gloves and a green plant. No people.</desc>
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faf5"/><stop offset="1" stop-color="#e3efdf"/></linearGradient>
 <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e5c49a"/><stop offset="1" stop-color="#c79a68"/></linearGradient>
 <linearGradient id="case" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#334b50"/><stop offset="1" stop-color="#1c3037"/></linearGradient>
 <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#dff7f4"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#b5e5df"/></linearGradient>
</defs>
<rect width="720" height="440" rx="26" fill="url(#wall)"/>
